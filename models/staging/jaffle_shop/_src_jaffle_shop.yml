sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    config:
      freshness:
        warn_after:
          count: 60
          period: day
        error_after:
          count: 90
          period: day
    tables:
      - name: customers
        columns:
          - name: id 
            data_tests:
              - unique
              - not_null
        config:
          loaded_at_field: null
      - name: orders
        columns:
          - name: id 
            data_tests:
              - unique
              - not_null
        config:
          loaded_at_field: _etl_loaded_at