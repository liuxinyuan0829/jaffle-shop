sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    config:
      freshness:
        warn_after:
          count: 30
          period: day
        error_after:
          count: 60
          period: day
    tables:
      - name: customers
        config:
          loaded_at_field: null
      - name: orders
        config:
          loaded_at_field: _etl_loaded_at